<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultá el documento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #4f8cff;
    --text: #e8e9ed;
    --muted: #8a8f9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .contenedor {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 90vh;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
  }
  .subtitulo {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .mensajes {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mensaje {
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 85%;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .usuario {
    background: var(--accent);
    align-self: flex-end;
  }
  .bot {
    background: #2a2e38;
    align-self: flex-start;
  }
  .error {
    background: #4a2222;
    align-self: flex-start;
    color: #ffb4b4;
  }
  .mensaje p {
    margin: 0 0 8px 0;
  }
  .mensaje p:last-child {
    margin-bottom: 0;
  }
  .mensaje ul, .mensaje ol {
    margin: 4px 0;
    padding-left: 20px;
  }
  .mensaje code {
    background: rgba(255,255,255,0.1);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .mensaje pre {
    background: rgba(255,255,255,0.08);
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
  }
  .mensaje a {
    color: #9cc4ff;
  }
  .form-input {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <h1>💬 Consultá el documento</h1>
    <div class="subtitulo">Este asistente responde solo preguntas sobre el contenido cargado.</div>
    <div class="mensajes" id="mensajes"></div>
    <div class="form-input">
      <input type="text" id="entrada" placeholder="Escribí tu pregunta..." autocomplete="off">
      <button id="enviar">Enviar</button>
    </div>
  </div>

  <script>
    const mensajesDiv = document.getElementById("mensajes");
    const entrada = document.getElementById("entrada");
    const botonEnviar = document.getElementById("enviar");

    let sessionId = localStorage.getItem("session_id") || null;

    function agregarMensaje(texto, clase) {
      const div = document.createElement("div");
      div.className = "mensaje " + clase;

      if (clase === "bot") {
        // Convertimos el Markdown a HTML y lo sanitizamos antes de insertarlo
        const html = marked.parse(texto);
        div.innerHTML = DOMPurify.sanitize(html);
      } else {
        // Mensajes del usuario y errores: texto plano, sin interpretar HTML
        div.textContent = texto;
      }

      mensajesDiv.appendChild(div);
      mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
    }

    async function enviarMensaje() {
      const texto = entrada.value.trim();
      if (!texto) return;

      agregarMensaje(texto, "usuario");
      entrada.value = "";
      botonEnviar.disabled = true;

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto, session_id: sessionId })
        });
        const datos = await resp.json();

        if (datos.session_id) {
          sessionId = datos.session_id;
          localStorage.setItem("session_id", sessionId);
        }

        if (datos.error) {
          agregarMensaje("Error: " + datos.error, "error");
        } else {
          agregarMensaje(datos.respuesta, "bot");
        }
      } catch (e) {
        agregarMensaje("No se pudo conectar con el servidor.", "error");
      } finally {
        botonEnviar.disabled = false;
        entrada.focus();
      }
    }

    botonEnviar.addEventListener("click", enviarMensaje);
    entrada.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviarMensaje();
    });
  </script>
</body>
</html>
